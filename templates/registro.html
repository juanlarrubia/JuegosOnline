{% extends "base.html" %}
{% block title %}Crear cuenta · Juegos Online{% endblock %}

{% block content %}
<section class="center-page">
    <div class="card auth-card">
        <a class="back" href="{{ url_for('index') }}">← Volver</a>
        <div class="logo small">🎮</div>
        <span class="eyebrow">NUEVO JUGADOR</span>
        <h2>Crear cuenta</h2>
        <p class="muted">Tu usuario será único. El correo quedará asociado a tu cuenta para identificarla en otros equipos.</p>

        <form method="post">
            <label>Nombre de usuario</label>
            <input name="username" required minlength="3" placeholder="Elige un nombre único">

            <label>Correo electrónico</label>
            <input name="email" type="email" required autocomplete="email" placeholder="tu@correo.com">

            <label>Contraseña</label>
            <input name="password" type="password" required minlength="6" placeholder="Mínimo 6 caracteres">

            <label>Repetir contraseña</label>
            <input name="password2" type="password" required minlength="6" placeholder="Repite la contraseña">

            <button class="primary" type="submit">CREAR MI CUENTA</button>
        </form>
    </div>
</section>
{% endblock %}
