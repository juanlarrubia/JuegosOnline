{% extends "base.html" %}
{% block title %}Conecta 4{% endblock %}
{% block content %}
<div class="boardgame-shell">
<header class="boardgame-head"><div><small>ESTRATEGIA</small><h1>🔴 Conecta 4</h1></div><a class="back-link" href="{{url_for('juegos')}}">← Juegos</a></header>
<div class="boardgame-hud"><span id="c4Turn">TU TURNO · 🔴</span><span>Primero en conectar 4</span></div>
<div id="c4Msg" class="board-msg">Toca una columna para dejar caer tu ficha.</div>
<div id="c4Board" class="c4-board"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
var B=Array.from({length:6},()=>Array(7).fill(0)),turn=1,over=false;
function win(r,c,p){var ds=[[1,0],[0,1],[1,1],[1,-1]];for(var d of ds){var n=1;for(var s of [-1,1]){var rr=r+d[0]*s,cc=c+d[1]*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&B[rr][cc]===p){n++;rr+=d[0]*s;cc+=d[1]*s}}if(n>=4)return true}return false}
function drop(col,p){for(var r=5;r>=0;r--)if(!B[r][col]){B[r][col]=p;if(win(r,col,p)){over=true;c4Msg.textContent=p===1?"🏆 ¡HAS GANADO!":"🤖 CPU ha ganado."}return true}return false}
function render(){var h="";for(var r=0;r<6;r++)for(var c=0;c<7;c++)h+='<button class="c4-slot '+(B[r][c]===1?'red':B[r][c]===2?'yellow':'')+'" onclick="window.C4('+c+')"></button>';c4Board.innerHTML=h;c4Turn.textContent=turn===1?"TU TURNO · 🔴":"CPU · 🟡"}
window.C4=function(c){if(over||turn!==1)return;if(!drop(c,1))return;render();if(over)return;turn=2;render();setTimeout(cpu,500)}
function cpu(){var cols=[0,1,2,3,4,5,6].filter(c=>B[0][c]===0),c=cols[Math.floor(Math.random()*cols.length)];drop(c,2);render();if(!over){turn=1;render()}}
render();
})();
</script>
{% endblock %}
