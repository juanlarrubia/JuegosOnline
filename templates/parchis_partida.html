{% extends "base.html" %}
{% block title %}Parchís Deluxe{% endblock %}
{% block content %}
<div class="parchis8-shell">
  <header class="parchis8-top">
    <div class="p8-brand"><span>🎲🎲</span><div><small>PARCHÍS DELUXE</small><strong>SALA {{ codigo }}</strong></div></div>
    <div id="turnText" class="p8-turn">Preparando…</div>
    <div id="doubleText" class="p8-doubles"></div>
  </header>

  <main class="parchis8-layout">
    <section class="p8-board-wrap">
      <div class="p8-board" id="board">
        <svg class="p8-board-svg" viewBox="0 0 900 900" aria-label="Tablero de Parchís">
          <defs>
            <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".25"/></filter>
          </defs>

          <rect x="15" y="15" width="870" height="870" rx="35" class="board-bg"/>

          <!-- Casas: disposición tradicional -->
          <g class="house yellow-house">
            <rect x="45" y="45" width="330" height="330" rx="34"/>
            <circle cx="135" cy="135" r="42"/><circle cx="285" cy="135" r="42"/>
            <circle cx="135" cy="285" r="42"/><circle cx="285" cy="285" r="42"/>
          </g>
          <g class="house green-house">
            <rect x="525" y="45" width="330" height="330" rx="34"/>
            <circle cx="615" cy="135" r="42"/><circle cx="765" cy="135" r="42"/>
            <circle cx="615" cy="285" r="42"/><circle cx="765" cy="285" r="42"/>
          </g>
          <g class="house blue-house">
            <rect x="45" y="525" width="330" height="330" rx="34"/>
            <circle cx="135" cy="615" r="42"/><circle cx="285" cy="615" r="42"/>
            <circle cx="135" cy="765" r="42"/><circle cx="285" cy="765" r="42"/>
          </g>
          <g class="house red-house">
            <rect x="525" y="525" width="330" height="330" rx="34"/>
            <circle cx="615" cy="615" r="42"/><circle cx="765" cy="615" r="42"/>
            <circle cx="615" cy="765" r="42"/><circle cx="765" cy="765" r="42"/>
          </g>

          <!-- Surcos blancos del tablero tradicional -->
          <g class="traditional-cross">
            <rect x="387" y="51" width="126" height="798" rx="2"/>
            <rect x="51" y="387" width="798" height="126" rx="2"/>
          </g>
          <!-- Meta central -->
          <g class="goal">
            <polygon points="450,450 387,387 513,387" class="goal-yellow"/>
            <polygon points="450,450 513,387 513,513" class="goal-green"/>
            <polygon points="450,450 513,513 387,513" class="goal-red"/>
            <polygon points="450,450 387,513 387,387" class="goal-blue"/>
            <circle cx="450" cy="450" r="34" class="goal-core"/>
            <text x="450" y="457" text-anchor="middle">🏆</text>
          </g>

          <!-- Pasillos finales -->
          <g id="finishLanes"></g>
          <!-- Recorrido de 68 casillas -->
          <g id="trackCells"></g>
        </svg>

        <div id="piecesLayer" class="p8-pieces"></div>
      </div>
    </section>

    <aside class="p8-sidebar">
      <div class="card p8-dice-card">
        <div class="panel-head"><div><span class="eyebrow">TIRADA</span><h3 id="diceOwner">Esperando…</h3></div></div>
        <div class="two-dice">
          <div id="die1" class="real-die">?</div>
          <div id="die2" class="real-die">?</div>
        </div>
        <button id="rollBtn" class="p8-roll" onclick="rollDice()">🎲 TIRAR LOS DOS DADOS 🎲</button>
        <div id="ruleNotice" class="p8-notice"></div>
      </div>

      <div class="card panel p8-actions-card">
        <span class="eyebrow">MOVIMIENTOS</span>
        <h3>Elige la jugada</h3>
        <div id="actions" class="p8-actions"></div>
      </div>

      <div class="card panel">
        <span class="eyebrow">PARTIDA</span>
        <div id="scoreList"></div>
      </div>

      <div class="card p8-event-card">
        <span id="eventIcon">🎲</span>
        <strong id="eventText">Comienza la partida</strong>
      </div>
    </aside>
  </main>
</div>

<div id="gameOver" class="gameover hidden">
  <div class="gameover-card">
    <div class="trophy">🏆</div>
    <span class="eyebrow">FINAL</span>
    <h1 id="winner"></h1>
    <div id="ranking"></div>
    <a href="{{ url_for('juegos') }}" class="start-button replay">VOLVER A JUEGOS</a>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const socket=io(),CODE="{{ codigo }}",ME={{ user.id }};
let STATE={{ sala|tojson }}, animationBusy=false;
const COLORS={rojo:"#e53950",azul:"#3185f5",verde:"#28b86a",amarillo:"#f0bc2c"};
const LABELS={rojo:"Rojo",azul:"Azul",verde:"Verde",amarillo:"Amarillo"};
const OFFSETS={amarillo:4,azul:21,rojo:38,verde:55};

socket.on("connect",()=>socket.emit("parchis_join",{code:CODE}));
let latestServerState=null;
let moveAnimationQueue=Promise.resolve();

socket.on("parchis_state",d=>{
  latestServerState=d;
  if(!animationBusy){
    STATE=d;
    latestServerState=null;
    render();
  }
});

socket.on("parchis_roll_result",d=>{
  latestServerState=d.state;
  if(!animationBusy){
    STATE=d.state;
    latestServerState=null;
    render();
  }
  animateDice(d.dice);
  playDiceSound();
});

socket.on("parchis_piece_move",d=>{
  // Nunca animar dos movimientos simultáneamente. Si la CPU usa dos dados,
  // el segundo espera a que termine visualmente el primero.
  moveAnimationQueue=moveAnimationQueue
    .then(()=>animatePieceMove(d))
    .catch(err=>console.error("Animación Parchís:",err));
});
socket.on("parchis_triple_double",d=>{STATE=d.state;playHomeSound();showFlash("⚠️ TERCER DOBLE","La última ficha vuelve a casa");render();});
socket.on("parchis_game_over",showOver);
socket.on("app_error",d=>toast(d.message));

function buildBoard(){
  const trackLayer=document.getElementById("trackCells");
  const lanesLayer=document.getElementById("finishLanes");
  trackLayer.innerHTML="";
  lanesLayer.innerHTML="";

  /*
   * TABLERO TRADICIONAL DE PARCHÍS — REJILLA 19×19
   *
   * Cada brazo tiene:
   *   8 casillas exteriores + 1 casilla de giro + 8 casillas interiores.
   *
   * Recorrido:
   *  1..8   = brazo superior, bajando
   *  9..16  = brazo izquierdo, hacia fuera
   *  17     = giro izquierdo
   *  18..25 = brazo izquierdo, hacia el centro
   *  26..33 = brazo inferior, bajando
   *  34     = giro inferior
   *  35..42 = brazo inferior, hacia el centro
   *  43..50 = brazo derecho, hacia fuera
   *  51     = giro derecho
   *  52..59 = brazo derecho, hacia el centro
   *  60..67 = brazo superior, subiendo
   *  68     = giro superior
   *
   * Después de 68 se vuelve físicamente a 1.
   */
  const CELL=42;
  const X0=72, Y0=72;
  const xy=(col,row)=>({x:X0+col*CELL,y:Y0+row*CELL});

  const SAFE_NUMBERS=[5,12,17,22,29,34,39,46,51,56,63,68];
  const EXIT_NUMBERS=[5,22,39,56];

  const rc=[];

  // 1..8 — columna izquierda del brazo superior, de fuera hacia centro
  for(let r=0;r<=7;r++) rc.push([8,r]);

  // 9..16 — fila superior del brazo izquierdo, de centro hacia fuera
  for(let c=7;c>=0;c--) rc.push([c,8]);

  // 17 — giro exterior izquierdo
  rc.push([0,9]);

  // 18..25 — fila inferior del brazo izquierdo, de fuera hacia centro
  for(let c=0;c<=7;c++) rc.push([c,10]);

  // 26..33 — columna izquierda del brazo inferior, de centro hacia fuera
  for(let r=11;r<=18;r++) rc.push([8,r]);

  // 34 — giro exterior inferior
  rc.push([9,18]);

  // 35..42 — columna derecha del brazo inferior, de fuera hacia centro
  for(let r=18;r>=11;r--) rc.push([10,r]);

  // 43..50 — fila inferior del brazo derecho, de centro hacia fuera
  for(let c=11;c<=18;c++) rc.push([c,10]);

  // 51 — giro exterior derecho
  rc.push([18,9]);

  // 52..59 — fila superior del brazo derecho, de fuera hacia centro
  for(let c=18;c>=11;c--) rc.push([c,8]);

  // 60..67 — columna derecha del brazo superior, de centro hacia fuera
  for(let r=7;r>=0;r--) rc.push([10,r]);

  // 68 — giro exterior superior
  rc.push([9,0]);

  if(rc.length!==68){
    console.error("ERROR: el tablero debe tener 68 casillas y tiene",rc.length);
  }

  window.TRACK=rc.map(([c,r])=>xy(c,r));

  TRACK.forEach((pt,i)=>{
    const num=i+1;

    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",pt.x-CELL/2+1);
    rect.setAttribute("y",pt.y-CELL/2+1);
    rect.setAttribute("width",CELL-2);
    rect.setAttribute("height",CELL-2);
    rect.setAttribute("rx",1);
    rect.setAttribute("class","track-cell");
    rect.dataset.number=num;

    if(SAFE_NUMBERS.includes(num)) rect.classList.add("safe-cell");
    if(EXIT_NUMBERS.includes(num)) rect.classList.add("exit-cell");
    if(num===5) rect.classList.add("exit-yellow");
    if(num===22) rect.classList.add("exit-blue");
    if(num===39) rect.classList.add("exit-red");
    if(num===56) rect.classList.add("exit-green");

    trackLayer.appendChild(rect);

    if(SAFE_NUMBERS.includes(num)){
      const safe=document.createElementNS("http://www.w3.org/2000/svg","circle");
      safe.setAttribute("cx",pt.x);
      safe.setAttribute("cy",pt.y);
      safe.setAttribute("r",12);
      safe.setAttribute("class","safe-mark");
      trackLayer.appendChild(safe);
    }

    const label=document.createElementNS("http://www.w3.org/2000/svg","text");
    label.setAttribute("x",pt.x);
    label.setAttribute("y",pt.y+4);
    label.setAttribute("text-anchor","middle");
    label.setAttribute("class","track-number");
    label.textContent=num;
    trackLayer.appendChild(label);
  });

  /*
   * Pasillos de llegada de 8 posiciones.
   * El último punto es el centro/meta.
   */
  const finishCoords={
    amarillo:[
      xy(9,1),xy(9,2),xy(9,3),xy(9,4),
      xy(9,5),xy(9,6),xy(9,7),{x:450,y:450}
    ],
    azul:[
      xy(1,9),xy(2,9),xy(3,9),xy(4,9),
      xy(5,9),xy(6,9),xy(7,9),{x:450,y:450}
    ],
    rojo:[
      xy(9,17),xy(9,16),xy(9,15),xy(9,14),
      xy(9,13),xy(9,12),xy(9,11),{x:450,y:450}
    ],
    verde:[
      xy(17,9),xy(16,9),xy(15,9),xy(14,9),
      xy(13,9),xy(12,9),xy(11,9),{x:450,y:450}
    ]
  };
  window.FINISH=finishCoords;

  Object.entries(finishCoords).forEach(([color,list])=>{
    list.slice(0,7).forEach(pt=>{
      const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x",pt.x-CELL/2+1);
      rect.setAttribute("y",pt.y-CELL/2+1);
      rect.setAttribute("width",CELL-2);
      rect.setAttribute("height",CELL-2);
      rect.setAttribute("rx",1);
      rect.setAttribute("class",`finish-cell finish-${color}`);
      lanesLayer.appendChild(rect);
    });
  });
}
function pieceXY(piece){
  if(piece.state==="home"){
    const homes={
      amarillo:[[135,135],[285,135],[135,285],[285,285]],
      verde:[[615,135],[765,135],[615,285],[765,285]],
      azul:[[135,615],[285,615],[135,765],[285,765]],
      rojo:[[615,615],[765,615],[615,765],[765,765]]
    };
    return homes[piece.color][piece.n-1];
  }
  if(piece.state==="track"){
    const gp=(OFFSETS[piece.color]+piece.pos)%68;
    const p=TRACK[gp];return[p.x,p.y];
  }
  if(piece.state==="finish"){
    const p=FINISH[piece.color][Math.max(0,piece.finish_pos)];return[p.x,p.y];
  }
  return[450,450];
}
function renderPieces(){
  const layer=document.getElementById("piecesLayer");
  layer.innerHTML="";

  // Calculamos primero dónde va cada ficha para detectar coincidencias.
  const visible=[];
  Object.entries(STATE.colors).forEach(([c,data])=>{
    data.pieces.forEach(p=>{
      const [x,y]=pieceXY(p);
      // Las fichas en casa ya tienen círculos distintos y no necesitan agruparse.
      const key=p.state==="home"
        ? `home:${p.id}`
        : `${p.state}:${Math.round(x)}:${Math.round(y)}`;
      visible.push({c,p,x,y,key});
    });
  });

  const groups={};
  visible.forEach(item=>{
    (groups[item.key]??=[]).push(item);
  });

  visible.forEach(item=>{
    const {c,p}=item;
    const group=groups[item.key];
    let x=item.x, y=item.y;
    const el=document.createElement("div");
    el.id="piece-"+p.id;

    const movable=
      STATE.turn_player_id===ME &&
      STATE.turn_color===c &&
      STATE.rolled &&
      (STATE.actions||[]).some(a=>a.piece_id===p.id);

    let overlapClass="";
    if(group.length===2 && p.state!=="home"){
      // Dos fichas: aproximadamente media escala y lado a lado.
      overlapClass=" paired";
      const idx=group.indexOf(item);
      x += idx===0 ? -11 : 11;
    }else if(group.length>2 && p.state!=="home"){
      // Protección visual para meta u otras coincidencias excepcionales.
      overlapClass=" stacked";
      const idx=group.indexOf(item);
      const angle=(Math.PI*2*idx)/group.length;
      x += Math.cos(angle)*13;
      y += Math.sin(angle)*13;
    }

    el.className=`p8-piece ${c} ${p.state==="done"?"done":""} ${movable?"movable":""}${overlapClass}`;
    el.style.left=(x/9)+"%";
    el.style.top=(y/9)+"%";

    if(movable){
      const activate=(ev)=>{
        ev.preventDefault();
        ev.stopPropagation();
        choosePieceAction(p.id,el);
      };
      el.addEventListener("click",activate);
      el.addEventListener("pointerup",activate);
    }

    el.innerHTML=`<span>${p.n}</span>`;
    layer.appendChild(el);
  });
}

let pieceTapLock=false;
function choosePieceAction(pieceId,el){
  if(animationBusy||pieceTapLock)return;
  pieceTapLock=true;
  setTimeout(()=>pieceTapLock=false,220);
  const acts=(STATE.actions||[]).filter(a=>a.piece_id===pieceId);
  if(!acts.length)return;
  if(acts.length===1){
    doAction(acts[0].id);
    return;
  }

  // Si todas las acciones equivalen al mismo movimiento (por ejemplo salida sumando 5),
  // ejecutamos directamente.
  const unique=[...new Map(acts.map(a=>[`${a.kind}-${a.value}`,a])).values()];
  if(unique.length===1){
    doAction(unique[0].id);
    return;
  }

  document.querySelectorAll(".p8-die-choice").forEach(x=>x.remove());
  const box=document.createElement("div");
  box.className="p8-die-choice";
  box.innerHTML=unique.map(a=>`
    <button onclick="doAction('${a.id}');this.parentElement.remove()">
      🎲 ${a.value}
    </button>`).join("");
  document.body.appendChild(box);

  const r=el.getBoundingClientRect();
  box.style.left=Math.max(8,Math.min(window.innerWidth-box.offsetWidth-8,r.left+r.width/2-box.offsetWidth/2))+"px";
  box.style.top=Math.max(8,r.top-box.offsetHeight-8)+"px";
}

function clearStaleCpuRoll(){
  const turn=STATE.players.find(p=>p.id===STATE.turn_player_id);
  const diceOwner=document.querySelector(".p8-dice-card h2");
  if(!turn||!diceOwner)return;
  diceOwner.textContent=turn.name;
}
function render(){
  if(!window.TRACK)buildBoard();
  const turn=STATE.players.find(p=>p.id===STATE.turn_player_id);
  const tc=STATE.turn_color;
  document.getElementById("turnText").innerHTML=STATE.turn_player_id===ME
    ? `🎲🎲 TU TURNO · <span class="turn-color ${tc}">${LABELS[tc]||""}</span>`
    : `Turno de ${turn?.name||"…"} · <span class="turn-color ${tc}">${LABELS[tc]||""}</span>`;
  document.getElementById("diceOwner").textContent=turn?.name||"Esperando…";
  document.getElementById("rollBtn").disabled=STATE.turn_player_id!==ME||STATE.rolled||animationBusy;
  document.getElementById("eventText").textContent=STATE.last_event||"";
  document.getElementById("eventIcon").textContent=STATE.bonus_queue?.length?"🎁":STATE.must_open_barrier?"🚧":"🎲";
  document.getElementById("doubleText").textContent=turn?.doubles_streak?`Dobles seguidos: ${turn.doubles_streak}/3`:"";
  if(!STATE.rolled){document.getElementById("die1").textContent="?";document.getElementById("die2").textContent="?";}
  renderPieces();renderActions();renderScores();renderNotice();
}
function renderActions(){
  const box=document.getElementById("actions");
  if(!box)return;
  if(STATE.turn_player_id!==ME){
    box.innerHTML='<div class="empty">Esperando al rival…</div>';
    return;
  }
  if(!STATE.rolled){
    box.innerHTML='<div class="empty">Tira los dos dados.</div>';
    return;
  }
  if(!STATE.actions?.length){
    box.innerHTML='<div class="empty">No hay movimientos disponibles.</div>';
    return;
  }
  box.innerHTML='<div class="tap-piece-help">👆 Toca una ficha iluminada para moverla</div>';
}
function renderNotice(){
  const e=document.getElementById("ruleNotice");
  if(STATE.must_open_barrier)e.innerHTML="🚧 <strong>Has sacado dobles:</strong> debes abrir una barrera.";
  else if(STATE.bonus_queue?.length)e.innerHTML=`🎁 Debes <strong>contar ${STATE.bonus_queue[0]}</strong> antes de continuar.`;
  else if(STATE.rolled&&STATE.dice){
    const pending=(STATE.pending_dice||[]).filter(d=>!d.used).map(d=>d.value);
    e.textContent=pending.length?`Por jugar: ${pending.join(" · ")}`:`Dados: ${STATE.dice[0]} + ${STATE.dice[1]}`;
  }
  else e.textContent="Dos dados · los dobles repiten turno";
}
function renderScores(){
  document.getElementById("scoreList").innerHTML=STATE.players.map(p=>`
    <div class="parchis-score ${p.id===STATE.turn_player_id?'active':''}">
      <span>${p.bot&&!p.fake_user?'🤖':p.name[0].toUpperCase()}</span>
      <div><strong>${p.name} <span class="stars-mini">⭐ ${p.stars||0}</span></strong><small>${(p.colors||[]).map(c=>LABELS[c]).join(" + ")}</small></div>
      <em>${p.score} pts</em>
    </div>`).join("");
}
function rollDice(){socket.emit("parchis_roll",{code:CODE})}
function doAction(id){if(animationBusy)return;socket.emit("parchis_action",{code:CODE,action_id:id})}
function animateDice(vals){
  const d1=document.getElementById("die1"),d2=document.getElementById("die2");let i=0;
  const t=setInterval(()=>{
    d1.textContent=1+Math.floor(Math.random()*6);d2.textContent=1+Math.floor(Math.random()*6);
    d1.classList.toggle("rolling");d2.classList.toggle("rolling");
    if(++i>10){clearInterval(t);d1.textContent=vals[0];d2.textContent=vals[1];d1.classList.remove("rolling");d2.classList.remove("rolling")}
  },85);
}
const PIECE_STEP_MS=330;
async function animatePieceMove(d){
  animationBusy=true;
  const m=d.movement;
  let el=document.getElementById("piece-"+m.piece_id);
  if(!el){STATE=d.state;render();el=document.getElementById("piece-"+m.piece_id);}
  playMoveSound();

  for(const step of m.path||[]){
    let p;
    if(step.state==="track")p=TRACK[step.global];
    else p=FINISH[m.color][step.finish_pos];
    el.style.left=(p.x/9)+"%";el.style.top=(p.y/9)+"%";
    el.classList.add("stepping");
    await sleep(PIECE_STEP_MS);
    el.classList.remove("stepping");
    playStepSound();
  }

  if(m.captured){
    playCaptureSound();showFlash("🍽️ ¡COMIDA!","Cuenta 20");
  }else if(m.goal){
    playGoalSound();showFlash("🏁 ¡FICHA EN META!","Cuenta 10");
  }else if(m.exit){
    playExitSound();
  }

  // El estado recibido durante la animación tiene prioridad.
  // Esto evita quedarse congelado después de sacar una ficha o gastar un dado.
  STATE=latestServerState||d.state;
  latestServerState=null;
  animationBusy=false;
  render();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function audioTone(freq,dur=.12,type="sine",gain=.05){
  try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(gain,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur)}catch(e){}
}
function playDiceSound(){audioTone(180,.08,"square",.04);setTimeout(()=>audioTone(240,.08,"square",.04),70);setTimeout(()=>audioTone(150,.1,"square",.04),140)}
function playMoveSound(){audioTone(320,.08,"triangle",.025)}
function playStepSound(){audioTone(520,.04,"sine",.018)}
function playCaptureSound(){audioTone(180,.22,"sawtooth",.07);setTimeout(()=>audioTone(90,.28,"sawtooth",.06),100)}
function playGoalSound(){[523,659,784].forEach((f,i)=>setTimeout(()=>audioTone(f,.28,"sine",.06),i*100))}
function playExitSound(){audioTone(660,.16,"triangle",.05)}
function playHomeSound(){audioTone(110,.4,"sawtooth",.06)}
function showFlash(title,sub){
  const f=document.createElement("div");f.className="p8-flash";f.innerHTML=`<strong>${title}</strong><small>${sub}</small>`;document.body.appendChild(f);setTimeout(()=>f.remove(),1700)
}
function toast(t){const e=document.createElement("div");e.className="live-toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2500)}
function showOver(d){
  document.getElementById("gameOver").classList.remove("hidden");
  document.getElementById("winner").textContent=d.winner+" gana la partida";
  document.getElementById("ranking").innerHTML=d.players.map((p,i)=>`<div class="rank-row"><b>#${i+1}</b><span>${p.bot?'🤖':'🎲'} ${p.name}</span><strong>${p.score} pts</strong></div>`).join("");
}
buildBoard();render();
</script>

<script>
fetch("/api/progreso/jugada",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({game:"parchis_deluxe",code:"{{ codigo }}"})
}).then(r=>r.json()).then(d=>{
  if(d.new_medals&&d.new_medals.length){
    d.new_medals.forEach(m=>{
      const e=document.createElement("div");e.className="live-toast medal-toast";
      e.textContent=`🏅 ${m.title} · +${m.stars} ⭐`;
      document.body.appendChild(e);setTimeout(()=>e.remove(),3500);
    });
  }
}).catch(()=>{});
</script>
{% endblock %}
