{% extends "base.html" %}
{% block title %}Serpientes y Escaleras{% endblock %}
{% block content %}
<div class="boardgame-shell">
<header class="boardgame-head"><div><small>CLÁSICO · CARRERA</small><h1>🐍 Serpientes y Escaleras</h1></div><a class="back-link" href="{{url_for('juegos')}}">← Juegos</a></header>
<div class="boardgame-hud"><span id="turnS">TU TURNO</span><span>🎲 <b id="diceS">—</b></span><span>Tú: <b id="mpS">1</b></span><span>CPU: <b id="cpS">1</b></span></div>
<div id="snakeMsg" class="board-msg">Sube por las escaleras y evita las serpientes.</div>
<div id="snakeBoard" class="path-board"></div>
<button id="rollSnake" class="roll-big">🎲 TIRAR DADO</button>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
var me=1,cpu=1,turn="me",over=false;
var ladders={3:22,8:30,20:41,28:55,44:77,58:83,71:92};
var snakes={17:4,33:12,48:26,62:45,79:60,88:67,97:76};
function render(){
 var h="";for(var n=1;n<=100;n++){var isL=ladders[n],isS=snakes[n],cl="path-cell"+(isL?" ladder-cell":"")+(isS?" snake-cell":"")+(n===100?" finish":"");h+='<div class="'+cl+'"><b>'+n+'</b><span class="cell-icon">'+(isL?"🪜":isS?"🐍":n===100?"🏆":"")+'</span><div class="pawns">'+(me===n?'<span class="pawn">🔵</span>':'')+(cpu===n?'<span class="pawn">🔴</span>':'')+'</div></div>'}snakeBoard.innerHTML=h;mpS.textContent=me;cpS.textContent=cpu;turnS.textContent=turn==="me"?"TU TURNO":"TURNO CPU";rollSnake.disabled=turn!=="me"||over;
}
function move(who,d){var p=who==="me"?me:cpu,np=Math.min(100,p+d),msg="";if(ladders[np]){np=ladders[np];msg="🪜 ¡Escalera! Subes hasta "+np;}else if(snakes[np]){np=snakes[np];msg="🐍 ¡Serpiente! Bajas hasta "+np;}if(who==="me")me=np;else cpu=np;if(np===100){over=true;snakeMsg.textContent=who==="me"?"🏆 ¡HAS GANADO!":"🤖 CPU ha ganado.";render();return;}snakeMsg.textContent=msg||((who==="me"?"Tú":"CPU")+" avanzas "+d);turn=who==="me"?"cpu":"me";render();if(turn==="cpu")setTimeout(cpuTurn,650)}
rollSnake.onclick=function(){var d=1+Math.floor(Math.random()*6);diceS.textContent=d;move("me",d)}
function cpuTurn(){var d=1+Math.floor(Math.random()*6);diceS.textContent=d;move("cpu",d)}
render();
})();
</script>
{% endblock %}
