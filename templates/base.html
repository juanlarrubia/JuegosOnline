<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Juegos Online{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script>
(function () {

    const originalFetch = window.fetch;

    window.fetch = function () {

        const url = arguments[0];

        return originalFetch.apply(this, arguments).then(function (response) {

            try {

                if (
                    typeof url === "string" &&
                    url.indexOf("/api/progreso/resultado") !== -1 &&
                    window.AndroidAds
                ) {

                    console.log("AD: partida terminada");

                    window.AndroidAds.partidaTerminada();
                }

            } catch (e) {

                console.log("Error avisando a Android:", e);

            }

            return response;
        });
    };

})();
</script>

</head>
<body class="theme-{{ profile_user.theme if profile_user else 'violeta' }}">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>

    <main class="app-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-zone">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    {% block scripts %}

   
    {% endblock %}
</body>
</html>
