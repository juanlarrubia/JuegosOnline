<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Juegos Online{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="theme-{{ profile_user.theme if profile_user else 'violeta' }}">
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>

    <main class="app-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-zone">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    {% block scripts %}

    <script>
        (function () {
            /*
             * Aviso a la aplicación Android cuando se registra
             * una partida mediante /api/progreso/jugada.
             *
             * No hace nada cuando se abre la web desde un navegador normal.
             */
            window.addEventListener("load", function () {

                if (!window.AndroidAds) {
                    return;
                }

                const originalFetch = window.fetch;

                window.fetch = function () {

                    const url = arguments[0];

                    return originalFetch.apply(this, arguments).then(function (response) {

                        try {
                            if (typeof url === "string" &&
                                url.indexOf("/api/progreso/jugada") !== -1) {

                                window.AndroidAds.partidaRegistrada();
                            }
                        } catch (e) {
                            console.log("Error avisando a Android:", e);
                        }

                        return response;
                    });
                };

            });
    </script>

    {% endblock %}
</body>
</html>
